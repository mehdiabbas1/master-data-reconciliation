name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run pipeline end to end
        run: |
          python data/generate.py -n 2000 -o data
          PYTHONPATH=src python -m mdr.cli \
            --legacy data/legacy_master.csv \
            --erp data/erp_master.csv \
            --truth data/ground_truth.csv \
            --out out --json

      - name: Upload reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: report-py${{ matrix.python-version }}
          path: out/
