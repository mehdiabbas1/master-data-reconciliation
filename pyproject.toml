[project]
name = "master-data-reconciliation"
version = "0.1.0"
description = "Reconcile a legacy master file against a new ERP master during migration"
requires-python = ">=3.10"
dependencies = ["rapidfuzz>=3.6", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mdr = "mdr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
